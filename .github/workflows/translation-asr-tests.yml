name: Translation and ASR regression tests

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  translation-asr:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install application and test dependencies
        run: python -m pip install -e . pytest

      - name: Run focused ASR and translation tests
        run: >-
          python -m pytest -q -p no:cacheprovider --noconftest
          tests/test_gemini_inline_context.py
          tests/test_gemini_translation.py
          tests/test_translation_review.py
          tests/test_transcribe_chunking.py
